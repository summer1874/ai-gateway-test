# Mirrors the prod proxy at 172.20.200.11: nginx defaults, so proxy_http_version 1.0 and proxy_buffering on.
worker_processes 1;
pid /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/run/nginx.pid;
error_log /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/logs/nginx-error.log;
events { worker_connections 256; }
http {
    access_log /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/logs/nginx-access.log;
    client_body_temp_path /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/run/nginx-body;
    proxy_temp_path /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/run/nginx-proxy;
    fastcgi_temp_path /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/run/nginx-fcgi;
    uwsgi_temp_path /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/run/nginx-uwsgi;
    scgi_temp_path /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/run/nginx-scgi;
    # MLflow behind nginx
    server { listen 127.0.0.1:18080; location / { proxy_pass http://127.0.0.1:5050; proxy_read_timeout 60s; } }
    # Bifrost behind the same kind of nginx
    server { listen 127.0.0.1:18081; location / { proxy_pass http://127.0.0.1:8080; proxy_read_timeout 60s; } }
    # Bifrost console with Chinese UI injected (HTTP/1.1 + WebSocket, separate from the 18081 test port)
    map $http_upgrade $bf_conn { default upgrade; '' close; }
    server {
        listen 127.0.0.1:18082;
        location /__zh/ { alias /Users/summer/Desktop/vibecoding/mlflow-bifrost-mock/bifrost-zh/; add_header Cache-Control no-cache; }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $bf_conn;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 3600s;
            sub_filter_once on;
            sub_filter '</head>' '<script src="/__zh/hide-enterprise.js"></script><script src="/__zh/zh-bifrost.js"></script></head>';
        }
    }
}
